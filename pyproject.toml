[project]
name = "medagentgym"
version = "0.1.0"
description = "MedAgentGym trajectory-generation harness for code-centric biomedical reasoning tasks"
readme = "README.md"
requires-python = ">=3.11"

# Harness dependencies only: everything needed to drive the gym, talk to the
# LLM API and grade the four remaining datasets. Packages that only the
# *agent-generated* code needs live in the `tasks` extra below.
dependencies = [
    "gymnasium>=1.1.1",
    "joblib>=1.4.2",
    "openai>=1.70.0",
    "PyYAML>=6.0.2",
    "requests>=2.32.0",
    "toml>=0.10.2",
]

[project.optional-dependencies]
# Installed into the same environment as the harness because `validate_code`
# executes the agent's code with the interpreter of the active venv.
tasks = [
    "biopython>=1.85",
    "lifelines>=0.30.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.4",
    "pandas>=2.2.2",
    # the agent may shell out to `pip install <pkg>` via the terminal action
    "pip>=25.0",
    "pysam>=0.23.0",
    "scikit-image>=0.25.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ehr_gym"]
