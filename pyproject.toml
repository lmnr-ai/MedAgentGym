[project]
name = "medagentgym"
version = "0.1.0"
description = "MedAgentGym trajectory-generation harness for code-centric biomedical reasoning tasks"
readme = "README.md"
requires-python = ">=3.11"

# Harness dependencies only: everything needed to drive the gym, talk to the
# LLM API and grade the four remaining datasets. Packages that only the
# *agent-generated* code needs live in the `tasks` extra below.
dependencies = [
    "gymnasium>=1.1.1",
    "joblib>=1.4.2",
    "openai>=1.70.0",
    "PyYAML>=6.0.2",
    "requests>=2.32.0",
    "toml>=0.10.2",
]

[project.optional-dependencies]
# Installed into the same environment as the harness because `validate_code`
# executes the agent's code with the interpreter of the active venv -- and
# because BioCoder's ground truth is the stdout of its reference program, so a
# package missing here does not make a task harder, it makes it ungradable.
# `scripts/filter_biocoder.py` recomputes the usable task set from whatever this
# list resolves to; re-run it after changing anything here.
tasks = [
    # Core scientific stack. The upper bounds are load-bearing: the BioCoder
    # snippets were scraped from 2014-2023 projects and call APIs that have since
    # been removed. numpy 2 dropped `np.asfarray` and `np.float_` (15 test tasks)
    # and scikit-image 0.23 dropped the `multichannel` kwarg.
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "scipy>=1.13,<1.14",
    "scikit-image>=0.22,<0.23",
    "scikit-learn>=1.6.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "plotly>=5.24",
    "PyComplexHeatmap>=1.7",
    "statsmodels>=0.14.4",
    "lifelines>=0.30.0",
    # Bioinformatics. pysam alone is worth ~70 BioCoder test tasks.
    "biopython>=1.85",
    "pysam>=0.23.0",
    "HTSeq>=2.0.0",
    "scikit-bio>=0.6.0",
    "biom-format>=2.1.16",
    "centrosome>=1.3.0",
    "pyfaidx>=0.8.0",
    "newick>=1.9.0",
    # Chemistry / molecular dynamics, each needed by a handful of tasks.
    "jax<0.4.32",
    "mdtraj>=1.10.0",
    "openmm>=8.0.0",
    "pymbar>=4.0.0",
    "pypdb>=2.3",
    # General-purpose imports that BioCoder snippets reach for.
    "boto3>=1.35.0",
    "click>=8.1.0",
    "colorlog>=6.9.0",
    "h5py>=3.12.0",
    "jinja2>=3.1.0",
    "lxml>=5.3.0",
    "numexpr>=2.10.0",
    "psutil>=6.0.0",
    "pulp>=2.9.0",
    "pybktree>=1.1",
    "reportlab>=4.2.0",
    "requests-toolbelt>=1.0.0",
    # `pkg_resources` / `distutils` for snippets predating their removal, and
    # `pip` because the agent may shell out to `pip install` via the terminal action.
    "pip>=25.0",
    "setuptools>=75.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ehr_gym"]
