# Every key here is exported verbatim as an environment variable at startup.

# Azure AI Foundry, the OpenAI-compatible /openai/v1 API (model_type = "Foundry").
# The endpoint may be the base or the full completions URL the portal shows you.
AZURE_OPENAI_ENDPOINT = "https://<YOUR_RESOURCE>.services.ai.azure.com/openai/v1"
AZURE_API_KEY = "<YOUR_API_KEY>"

# Classic Azure OpenAI, which routes by deployment name (model_type = "Azure").
# AZURE_OPENAI_API_KEY = "<YOUR_API_KEY>"
# API_VERSION = "2024-05-01-preview"

# Only needed when a config sets model_type = "OpenAI"
# OPENAI_API_KEY = "<YOUR_OPENAI_API_KEY>"

# Laminar. Trajectories are traced when this is set and not traced when it is
# absent; nothing else in the harness changes.
LMNR_PROJECT_API_KEY = "<YOUR_LAMINAR_PROJECT_API_KEY>"
# LMNR_BASE_URL = "https://api.lmnr.ai"
